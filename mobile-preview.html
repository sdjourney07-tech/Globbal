<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Globbal — Mobile preview</title>
    <style>
      :root {
        color-scheme: dark;
        --frame-bg: #111;
        --frame-border: #3a3a3a;
        --screen-radius: 34px;
        --bezel: 10px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 1rem;
        font-family: Inter, Segoe UI, system-ui, sans-serif;
        background: radial-gradient(circle at 50% 0%, #2a241c, #12100e 55%);
        color: #f3e8d4;
      }

      .preview-header {
        text-align: center;
      }

      .preview-header h1 {
        margin: 0 0 0.35rem;
        font-size: 1.15rem;
        font-weight: 600;
      }

      .preview-header p {
        margin: 0;
        color: #b8a88a;
        font-size: 0.88rem;
      }

      .preview-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
        justify-content: center;
      }

      .preview-controls label {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 0.85rem;
        color: #d9cbb0;
      }

      .preview-controls select,
      .preview-controls button {
        font: inherit;
        border-radius: 8px;
        border: 1px solid #5c4632;
        background: #2a1a0f;
        color: #f3e8d4;
        padding: 0.45rem 0.65rem;
      }

      .preview-controls button {
        cursor: pointer;
      }

      .preview-controls button:hover,
      .preview-controls select:hover {
        border-color: #8b5a2b;
      }

      .phone-shell {
        position: relative;
        padding: var(--bezel);
        border-radius: calc(var(--screen-radius) + var(--bezel));
        background: linear-gradient(145deg, #2b2b2b, #151515);
        box-shadow:
          0 24px 60px rgba(0, 0, 0, 0.55),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }

      .phone-screen {
        width: var(--phone-w, 390px);
        height: var(--phone-h, 844px);
        border-radius: var(--screen-radius);
        overflow: hidden;
        background: #000;
        border: 1px solid var(--frame-border);
      }

      .phone-screen iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
        background: #b08a58;
      }

      .preview-meta {
        font-size: 0.8rem;
        color: #9a8868;
      }

      .preview-meta code {
        font-family: ui-monospace, monospace;
        color: #e8cfa8;
      }
    </style>
  </head>
  <body>
    <header class="preview-header">
      <h1>Globbal</h1>
      <p>Mobile preview — 390×844 portrait (iPhone 14 / common Android size).</p>
    </header>

    <div class="preview-controls">
      <label>
        Screen
        <select id="pageSelect">
          <option value="./splash.html" selected>Splash screen</option>
          <option value="./practice.html">Practice game</option>
          <option value="./practice-ancient.html">Ancient practice</option>
          <option value="./index.html?dictionary=1">Dictionary</option>
          <option value="./index.html">Main menu</option>
          <option value="./game-online.html">Online match</option>
        </select>
      </label>
      <button type="button" id="rotateBtn" aria-pressed="false">Rotate (landscape)</button>
      <button type="button" id="reloadBtn">Reload</button>
      <a href="./splash.html" style="color: #e8cfa8; font-size: 0.85rem">Open full width</a>
    </div>

    <div class="phone-shell" id="phoneShell">
      <div class="phone-screen" id="phoneScreen">
        <iframe id="gameFrame" title="Globbal mobile preview" src="./splash.html"></iframe>
      </div>
    </div>

    <p class="preview-meta" id="sizeLabel">Viewport: <code>390 × 844</code> portrait</p>

    <script>
      const PORTRAIT = { w: 390, h: 844 };
      const LANDSCAPE = { w: 844, h: 390 };

      const pageSelect = document.getElementById("pageSelect");
      const rotateBtn = document.getElementById("rotateBtn");
      const reloadBtn = document.getElementById("reloadBtn");
      const gameFrame = document.getElementById("gameFrame");
      const phoneScreen = document.getElementById("phoneScreen");
      const sizeLabel = document.getElementById("sizeLabel");

      let landscape = false;

      function applySize() {
        const size = landscape ? LANDSCAPE : PORTRAIT;
        phoneScreen.style.setProperty("--phone-w", `${size.w}px`);
        phoneScreen.style.setProperty("--phone-h", `${size.h}px`);
        rotateBtn.setAttribute("aria-pressed", String(landscape));
        rotateBtn.textContent = landscape ? "Rotate (portrait)" : "Rotate (landscape)";
        sizeLabel.innerHTML = `Viewport: <code>${size.w} × ${size.h}</code> ${landscape ? "landscape" : "portrait"}`;
      }

      function loadPage() {
        gameFrame.src = pageSelect.value;
      }

      pageSelect.addEventListener("change", loadPage);
      reloadBtn.addEventListener("click", () => {
        gameFrame.src = gameFrame.src;
      });
      rotateBtn.addEventListener("click", () => {
        landscape = !landscape;
        applySize();
      });

      applySize();
    </script>
  </body>
</html>
