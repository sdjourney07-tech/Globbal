<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Reset password · Globbal</title>
    <link rel="icon" href="./assets/favicon.ico" sizes="any" />
    <link rel="icon" href="./assets/logo-mark.svg" type="image/svg+xml" />
    <link rel="preload" href="./assets/parch2copy.png" as="image" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./styles-splash.css" />
    <link
      rel="stylesheet"
      href="./styles-mobile.css"
      media="screen and (max-width: 640px), screen and (max-height: 640px) and (orientation: landscape)"
    />
  </head>
  <body class="landing-body">
    <div class="landing-shell parchment-shell">
      <div class="splash-parchment" aria-hidden="true">
        <div class="splash-parchment-sheet-wrap">
          <img
            class="splash-parchment-sheet"
            src="./assets/parch2copy.png"
            alt=""
            draggable="false"
          />
          <div class="splash-parchment-sheet-shade"></div>
        </div>
      </div>
      <div class="splash-vignette" aria-hidden="true"></div>

      <main class="landing">
        <section class="landing-card landing-account-card">
          <h2>Reset password</h2>
          <p>Choose a new password for your Globbal account.</p>
          <form id="resetForm" class="landing-auth-form" action="#" method="post">
            <label>
              New password
              <input
                id="resetPassword"
                name="password"
                type="password"
                autocomplete="new-password"
                minlength="6"
                required
              />
            </label>
            <label>
              Confirm password
              <input
                id="resetPasswordConfirm"
                name="passwordConfirm"
                type="password"
                autocomplete="new-password"
                minlength="6"
                required
              />
            </label>
            <div class="landing-auth-actions">
              <button type="submit" id="resetSubmitBtn">Save new password</button>
            </div>
            <p id="resetError" class="landing-error" aria-live="polite"></p>
            <p class="landing-auth-links">
              <a href="./index.html">Back to main menu</a>
            </p>
          </form>
        </section>
      </main>
    </div>

    <script src="./accounts-client.js"></script>
    <script>
      (function resetPasswordPage() {
        const accounts = window.GlobbleAccounts;
        const form = document.getElementById("resetForm");
        const passwordEl = document.getElementById("resetPassword");
        const confirmEl = document.getElementById("resetPasswordConfirm");
        const errorEl = document.getElementById("resetError");
        const submitBtn = document.getElementById("resetSubmitBtn");
        const params = new URLSearchParams(location.search);
        const token = (params.get("token") || "").trim();

        function setError(message) {
          if (errorEl) errorEl.textContent = message || "";
        }

        if (!token) {
          setError("This reset link is missing or incomplete. Request a new one from the main menu.");
          if (submitBtn) submitBtn.disabled = true;
          return;
        }

        form?.addEventListener("submit", async (event) => {
          event.preventDefault();
          setError("");
          const password = passwordEl?.value || "";
          const confirm = confirmEl?.value || "";
          if (password.length < 6) {
            setError("Password must be at least 6 characters.");
            return;
          }
          if (password !== confirm) {
            setError("Passwords do not match.");
            return;
          }
          if (submitBtn) submitBtn.disabled = true;
          try {
            const data = await accounts.api("/api/auth/reset-password", {
              method: "POST",
              body: JSON.stringify({ token, password })
            });
            accounts.setSession(data.token, data.user);
            setError("Password updated. Taking you to the main menu…");
            location.href = "./index.html";
          } catch (err) {
            setError(err.message || "Could not reset password.");
            if (submitBtn) submitBtn.disabled = false;
          }
        });
      })();
    </script>
  </body>
</html>
