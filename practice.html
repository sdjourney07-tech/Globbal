<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script src="./preview-embed.js"></script>
    <title>Globbal — Practice</title>
    <link rel="icon" href="./assets/favicon.ico" sizes="any" />
    <link rel="icon" href="./assets/logo-mark.svg" type="image/svg+xml" />
    <link rel="preload" href="./assets/ancient-compass-map-original.png" as="image" />
    <link rel="preload" href="./assets/parch2copy.png" as="image" />
    <link rel="stylesheet" href="./styles.css?v=board19-wordmark1" />
    <link rel="stylesheet" href="./styles-splash.css" />
    <link
      rel="stylesheet"
      href="./styles-mobile.css?v=board19-wordmark1"
      media="screen and (max-width: 640px), screen and (max-height: 640px) and (orientation: landscape)"
    />
    <style>
      .parchment-shell.is-game-loading > .play-layout {
        opacity: 0;
        visibility: hidden;
      }
    </style>
  </head>
  <body class="gameplay-body">
    <main class="app app-gameplay">
      <div class="play-stage parchment-shell is-game-loading">
        <div class="splash-parchment" aria-hidden="true">
          <div class="splash-parchment-sheet-wrap">
            <img
              class="splash-parchment-sheet"
              src="./assets/parch2copy.png"
              alt=""
              draggable="false"
            />
            <div class="splash-parchment-sheet-shade"></div>
          </div>
        </div>
        <div class="splash-vignette" aria-hidden="true"></div>
        <div class="game-load-curtain" id="gameLoadCurtain" aria-hidden="true">
          <img
            class="splash-parchment-map"
            src="./assets/ancient-compass-map-original.png"
            alt=""
            draggable="false"
          />
          <div class="splash-vignette" aria-hidden="true"></div>
        </div>
        <div class="play-layout">
          <header class="play-brand">
            <h1 class="logo-wordmark-wrap">
              <img
                class="logo-wordmark"
                src="./assets/logo-wordmark.svg"
                width="425"
                height="90"
                alt="Globbal"
                decoding="async"
              />
            </h1>
          </header>
          <div class="play-focus">

          <div class="play-status" aria-live="polite">
            <div id="turnInfo" class="status">Player 1 turn</div>
            <div id="message" class="message"></div>
          </div>

          <section class="game-stats-tray" aria-label="Bag, pending score, and playable words">
            <div class="game-stats-tray-oak">
              <div class="game-stats-buttons">
                <span id="bagCount" class="game-stats-label score-cell" aria-live="polite"></span>
                <span
                  id="pendingTurnScore"
                  class="game-stats-label game-stats-label-score score-cell"
                  aria-live="polite"
                  aria-label="Pending turn score"
                ></span>
                <span id="playableWordsCount" class="game-stats-label score-cell" aria-live="polite"></span>
              </div>
            </div>
          </section>

          <section class="board-wrap">
            <div class="board-stage">
              <div id="board" class="board"></div>
            </div>
          </section>

          <section class="rack-panel">
            <div id="rack" class="rack"></div>
          </section>
          </div>

          <section class="rack-panel controls-rack">
            <aside class="game-action-rail" aria-label="Game actions">
              <button type="button" id="submitTurnBtn">Submit</button>
              <button type="button" id="recallTilesBtn">Recall</button>
              <button type="button" id="passTurnBtn">Pass</button>
              <button type="button" id="shuffleRackBtn">Shuffle</button>
              <button type="button" id="newGameBtn">New Game</button>
            </aside>

            <section class="score-strip" aria-label="Scores">
              <div id="player1Score" class="score score-cell active">Player 1: 0</div>
              <div class="score-strip-nav">
                <a href="./index.html" class="score-home-btn" aria-label="Main menu" title="Main menu">
                  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path
                      fill="currentColor"
                      d="M12 3.2 4 10v11h6v-7h4v7h6V10L12 3.2zm0 2.4 5 4.5V19h-2v-6H9v6H7v-9.1l5-4.3z"
                    />
                  </svg>
                </a>
                <button
                  type="button"
                  id="soundToggleBtn"
                  class="score-sound-btn"
                  aria-label="Mute all sound"
                  title="Mute all sound"
                  aria-pressed="false"
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path class="sound-speaker" d="M4 9v6h4l5 4V5L8 9H4z" />
                    <path class="sound-wave" d="M16 8.2a5 5 0 0 1 0 7.6M18.7 5.5a8.8 8.8 0 0 1 0 13" />
                    <path class="sound-muted-slash" d="M16 9l5 6M21 9l-5 6" />
                  </svg>
                </button>
                <a
                  class="score-dictionary-btn game-dictionary-link"
                  href="./index.html?dictionary=1&amp;return=./practice.html"
                  aria-label="Dictionary"
                  title="Dictionary"
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path
                      fill="currentColor"
                      d="M6 3h11a2 2 0 0 1 2 2v14.5a1.5 1.5 0 0 0-1.5-1.5H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm0 2v11h11.7A2 2 0 0 1 18 16V5H6zm2 2h8v2H8V7zm0 4h8v2H8v-2z"
                    />
                  </svg>
                </a>
              </div>
              <div id="player2Score" class="score score-cell">Player 2: 0</div>
            </section>
          </section>
        </div>
      </div>
    </main>

    <script src="./board-zoom.js"></script>
    <script src="./place-info.js"></script>
    <script src="./ambient-sound.js?v=noclack1"></script>
    <script src="./rack-shuffle.js?v=shuffle6"></script>
    <script src="./rack-return.js"></script>
    <script src="./rack-reorder.js"></script>
    <script src="./tile-pointer-drag.js"></script>
    <script src="./blank-picker.js"></script>
    <script src="./practice-resume.js"></script>
    <script src="./game-load-reveal.js"></script>
    <script src="./dictionary-keys.js"></script>
    <script src="./dictionary-alias-sources.js"></script>
    <script src="./dictionary.js"></script>
    <script src="./pending-word-glow.js"></script>
    <script src="./playable-words.js"></script>
    <script src="./invalid-word-toast.js"></script>
    <script src="./word-wikipedia-reveal.js"></script>
    <script src="./app.js?v=fair-racks2"></script>
  </body>
</html>
